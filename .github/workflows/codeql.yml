name: CodeQL

# Replaces the repository's CodeQL "default setup". Default setup must be
# disabled in Settings → Code security, or this workflow's upload is rejected.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          queries: security-and-quality

      - name: Build
        working-directory: src
        run: go build ./...

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
