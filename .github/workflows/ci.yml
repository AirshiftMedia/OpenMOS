name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src

jobs:
  go:
    name: Build, vet, test, staticcheck
    runs-on: ubuntu-latest
    # Throwaway PostgreSQL for the store tests; they skip without
    # OPENMOS_TEST_DATABASE_URL locally, but must run here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openmos
          POSTGRES_PASSWORD: openmos
          POSTGRES_DB: openmos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openmos -d openmos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENMOS_TEST_DATABASE_URL: postgres://openmos:openmos@localhost:5432/openmos_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
